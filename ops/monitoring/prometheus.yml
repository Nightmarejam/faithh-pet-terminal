# Reference stack: WSL Docker monitoring often mounts ~/ops/monitoring/prometheus.yml
# (see container inspect). Keep this file aligned when using the ai-stack copy.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules/security_alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["localhost:9100"]

  - job_name: nas
    static_configs:
      - targets: ["100.79.85.32:9100"]
        labels:
          instance: nas
          role: storage
          host: synology

  - job_name: fail2ban
    static_configs:
      - targets: ["localhost:9635"]

  - job_name: grafana
    static_configs:
      - targets: ["localhost:3000"]
    metrics_path: /metrics

  - job_name: uptime_kuma
    static_configs:
      - targets: ["localhost:3001"]
    metrics_path: /metrics
