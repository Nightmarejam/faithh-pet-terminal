# FAITHH model/provider configuration
# Phase 2: multi-provider routing enabled
# Updated: 2026-05-18

providers:
  groq:
    type: "groq"
    # qwen/qwen3-32b was retired by Groq and 404s. Verified against the live list
    # 2026-07-28; re-check with:
    #   curl -s https://api.groq.com/openai/v1/models -H "Authorization: Bearer $GROQ_API_KEY"
    model: "llama-3.3-70b-versatile"
    temperature: 0.2
    max_tokens: 800
    timeout_s: 45

  ollama:
    type: "ollama"
    base_url: "http://localhost:11434"
    model: "qwen25-grounded-gen5-delta:latest"
    temperature: 0.2
    max_tokens: 800
    timeout_s: 300
    # Optional list passed to Ollama options.stop; omit to use FAITHH defaults (====, [CTX:, User:, etc.)
    # ollama_stop: []

  local_webui:
    type: "openai_compatible"
    base_url: "http://localhost:7001/v1"
    # Must match whatever text-generation-webui has loaded; verify: curl -s http://localhost:7001/v1/models
    model: "qwen25-grounded-gen5-delta:latest"
    temperature: 0.2
    max_tokens: 900
    timeout_s: 300

  vllm:
    type: "openai_compatible"
    # vLLM runs on the Windows box's RTX 3090, NOT on this host. "localhost:8000"
    # here was pointing at the Gen8's own ChromaDB, which answers /api/v2/heartbeat
    # and 404s /v1/chat/completions — so every vllm attempt failed and fell through
    # the route list. Reachable over the tailnet thanks to WSL mirrored networking.
    base_url: "http://desktop-iifeikl.taileb8c60.ts.net:8000/v1"
    # Must match what vLLM advertises; verify:
    #   curl -s http://desktop-iifeikl.taileb8c60.ts.net:8000/v1/models
    model: "qwen2.5-14b"
    temperature: 0.2
    max_tokens: 2048
    timeout_s: 300

routes:
  # Local-first; Groq gate in llm_providers strips Groq for simple queries when Ollama is healthy
  auto: ["vllm", "local_webui", "ollama", "groq"]

  code: ["vllm", "local_webui", "groq", "ollama"]

  fast: ["groq", "vllm", "local_webui", "ollama"]

  local: ["vllm", "local_webui", "ollama"]

  cloud: ["groq"]

  reasoning: ["vllm", "local_webui", "ollama", "groq"]
