# FAITHH Phase-2 routing — vLLM first (OpenAI-compatible), Ollama optional.
# Copy or edit on faithh; restart backend after changes.

providers:
  groq:
    type: "groq"
    model: "qwen/qwen3-32b"
    temperature: 0.2
    max_tokens: 800
    timeout_s: 45

  ollama:
    type: "ollama"
    base_url: "http://127.0.0.1:11434"
    model: "qwen25-grounded-gen5-delta:latest"
    temperature: 0.2
    max_tokens: 800
    timeout_s: 300

  # vLLM / text-generation-webui / any OpenAI-compatible server (trailing /v1 required).
  local_webui:
    type: "openai_compatible"
    base_url: "http://127.0.0.1:8000/v1"
    # MUST match an "id" from /v1/models. On faithh after vLLM is up:
    #   ./venv/bin/python scripts/ops/print_first_vllm_model_id.py
    # Or: curl -sS http://127.0.0.1:8000/v1/models | head -c 2000
    model: "REPLACE_WITH_ID_FROM_V1_MODELS"
    temperature: 0.2
    max_tokens: 900
    timeout_s: 300

routes:
  # Lean: vLLM first; add "ollama" if you need fallback.
  auto: ["local_webui", "groq"]
  code: ["local_webui", "groq", "ollama"]
  fast: ["groq", "local_webui"]
  local: ["local_webui", "ollama"]
  cloud: ["groq"]
  reasoning: ["local_webui", "groq"]
