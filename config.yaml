# FAITHH Tool System Configuration
# Battle Chip execution and security settings

security:
  # Allowed directories for file operations
  allowed_directories:
    # Canonical tool/workspace tree (no separate /home/jonat/faithh on disk).
    # /tmp/faithh: optional scratch; mkdir if listed (see docs/ops/MULTI_HOST_AUDIT.md).
    - /home/jonat/ai-stack
    - /tmp/faithh
  
  # Blocked shell commands for safety
  blocked_commands:
    - rm
    - dd
    - mkfs
    - format
    - fdisk
    - shutdown
    - reboot
    - halt
  
  # Default permissions for tools
  default_permissions:
    - file.read
    - process.read
    - rag.query

# Tool execution settings
tools:
  execution_timeout_ms: 30000
  max_concurrent_executions: 5
  enable_combos: true
  combo_bonus_multiplier: 1.5

# API configuration
api:
  host: localhost
  port: 5557
  websocket_path: /ws/tools
  enable_cors: true
  allowed_origins:
    - http://localhost:8080
    - http://127.0.0.1:8080

# Logging configuration
logging:
  level: INFO
  file: logs/tool_execution.log
  max_file_size_mb: 10
  backup_count: 5
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'

# AI Provider configuration
ai:
  primary_provider: ollama
  fallback_provider: anthropic
  
  # Local FAITHH models (primary)
  ollama:
    model: qwen25-grounded:latest
    base_url: http://localhost:11434
    # Offloading options to improve context handling
    # Number of GPU layers to keep on GPU (0 = all CPU, -1 = all GPU)
    gpu_layers: -1
    # Context size in tokens (0 = model default)
    context_size: 0
    # Batch size for processing (higher = faster but more VRAM)
    batch_size: 512
    # Keep model in memory after request
    keep_alive: 2h  # Reduced for memory efficiency
  
  # Groq models (primary inference)
  groq_models:
    default: llama-3.3-70b-versatile
    fast: llama-3.1-8b-instant
    reasoning: openai/gpt-oss-120b
  
  # Anthropic API (fallback for complex tasks)
  anthropic:
    api_key: ${ANTHROPIC_API_KEY}
    default_model: claude-3-haiku-20240307
    backup_model: claude-3-haiku-20240307
    max_tokens: 4096
    temperature: 0.1
    # Cost optimization settings
    enable_prompt_caching: true
    enable_batch_processing: true
    monthly_budget: 20.0
    cache_ttl_minutes: 60
  
    
  # Heavy reasoning model (disabled until environment tuned)
  # heavy_reasoning:
  #   provider: ollama
  #   model: deepseek-r1:32b
  #   gpu_layers: -1
  #   context_size: 8192
  #   batch_size: 512
  #   keep_alive: 30min  # Load on demand
